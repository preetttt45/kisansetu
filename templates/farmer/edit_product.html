
{% extends "base.html" %}

{% block title %}Edit Product | KisanSetu AI{% endblock %}

{% block page_heading %}Edit Product{% endblock %}

{% block content %}

<div style="margin-bottom: 24px;">
    <h1>Edit Agricultural Product ✏️</h1>
    <p style="color: #64748b;">
        Update your crop details, quantity, price and location.
    </p>
</div>

<div class="form-card">

    <form method="POST">

        <div class="form-group">
            <label for="crop_name">Crop Name</label>
            <input
                type="text"
                id="crop_name"
                name="crop_name"
                class="form-control"
                value="{{ product['crop_name'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="quantity">Quantity (kg)</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                class="form-control"
                step="any"
                min="0.01"
                value="{{ product['quantity'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="price">Price per kg (₹)</label>
            <input
                type="number"
                id="price"
                name="price"
                class="form-control"
                step="any"
                min="0.01"
                value="{{ product['price'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="quality">Crop Quality</label>
            <select
                id="quality"
                name="quality"
                class="form-control"
                required
            >
                <option value="A Grade"
                    {% if product['quality'] == 'A Grade' %}selected{% endif %}>
                    A Grade
                </option>

                <option value="B Grade"
                    {% if product['quality'] == 'B Grade' %}selected{% endif %}>
                    B Grade
                </option>

                <option value="C Grade"
                    {% if product['quality'] == 'C Grade' %}selected{% endif %}>
                    C Grade
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                class="form-control"
                value="{{ product['location'] }}"
                required
            >
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{{ url_for('my_products') }}"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}

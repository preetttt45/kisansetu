
{% extends "base.html" %}

{% block title %}Add Product | KisanSetu AI{% endblock %}

{% block page_heading %}Add New Product{% endblock %}

{% block content %}

<div style="margin-bottom: 24px;">
    <h1>Add Agricultural Product 🌾</h1>
    <p style="color: #64748b;">
        List your crops in the marketplace for buyers to discover.
    </p>
</div>

<div class="form-card">
    <form method="POST">

        <div class="form-group">
            <label for="crop_name">Crop Name</label>
            <input
                type="text"
                id="crop_name"
                name="crop_name"
                class="form-control"
                placeholder="e.g. Wheat, Rice, Mustard"
                required
            >
        </div>

        <div class="form-group">
            <label for="quantity">Quantity (kg)</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                class="form-control"
                placeholder="Enter available quantity"
                min="0.01"
                step="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label for="price">Price per kg (₹)</label>
            <input
                type="number"
                id="price"
                name="price"
                class="form-control"
                placeholder="Enter price in rupees"
                min="0.01"
                step="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label for="quality">Crop Quality</label>
            <select
                id="quality"
                name="quality"
                class="form-control"
                required
            >
                <option value="">Select quality</option>
                <option value="A Grade">A Grade</option>
                <option value="B Grade">B Grade</option>
                <option value="C Grade">C Grade</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                class="form-control"
                placeholder="Enter your village, town or city"
                required
            >
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">
                + Add Product
            </button>

            <a href="{{ url_for('farmer_dashboard') }}"
               class="btn btn-secondary">
                Back to Dashboard
            </a>
        </div>

    </form>
</div>

{% endblock %}
